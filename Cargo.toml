[package]
name = "eve-combat-assistant"
version = "0.3.4"
edition = "2024"
rust-version = "1.99"
publish = false

[[bin]]
name = "eve-combat-assistant"
path = "rust/main.rs"

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "clipboard", "links"] }
esf-dogma-engine = { path = "native/vendor/dogma-engine", default-features = false, features = ["rust", "eft"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.1"
ureq = { version = "=3.5.0", features = ["json", "gzip"] }
rusqlite = { version = "=0.41.0", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
clap = { version = "4.6", features = ["derive"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
url = "2.5"
jsonwebtoken = { version = "9.3", default-features = false }
webbrowser = "1.0"
arboard = { version = "3.7", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Security_Cryptography"] }
tray-icon = "=0.26.1"
windows = { version = "0.62.2", features = ["Media_Ocr", "Globalization", "Graphics_Imaging", "Security_Cryptography", "Storage_Streams", "Win32_System_WinRT"] }

[profile.release]
opt-level = "s"
strip = true
# Полная dogma-база встроена в EXE; LTO заметно повышает пик памяти линкера.
lto = false
